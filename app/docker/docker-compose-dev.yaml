version: "3"

volumes:
  data:
  metadata_data:

networks:
  wren:
    driver: bridge

services:
  wren-engine:
    image: wren-toolkit-http:${WREN_ENGINE_VERSION:-latest}
    build:
      context: ../../toolkit/core/wren
    platform: ${PLATFORM}
    expose:
      - 8000
    ports:
      - ${WREN_ENGINE_PORT:-8000}:8000
    environment:
      WREN_TOOLKIT_METADATA_DATABASE_URL: postgresql://wren:wren123@wren-ui-metadata-postgres:5432/wren_ui_metadata
    networks:
      - wren
    depends_on:
      wren-ui-metadata-postgres:
        condition: service_healthy

  wren-ui-metadata-postgres:
    image: postgres:16
    pull_policy: always
    platform: ${PLATFORM}
    environment:
      POSTGRES_DB: wren_ui_metadata
      POSTGRES_USER: wren
      POSTGRES_PASSWORD: wren123
    volumes:
      - metadata_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wren -d wren_ui_metadata"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wren

  wren-ai-service:
    image: ghcr.io/canner/wren-ai-service:${WREN_AI_SERVICE_VERSION}
    pull_policy: always
    platform: ${PLATFORM}
    ports:
      - ${AI_SERVICE_FORWARD_PORT}:${WREN_AI_SERVICE_PORT}
    environment:
      WREN_UI_ENDPOINT: http://host.docker.internal:${WREN_UI_PORT}
      WREN_UI_INTERNAL_API_TOKEN: ${WREN_UI_INTERNAL_API_TOKEN}
      # sometimes the console won't show print messages,
      # using PYTHONUNBUFFERED: 1 can fix this
      PYTHONUNBUFFERED: 1
      CONFIG_PATH: /app/config.yaml
    env_file:
      - ${PROJECT_DIR}/.env
    volumes:
      - ${PROJECT_DIR}/config.yaml:/app/config.yaml:ro
      - ${PROJECT_DIR}/data:/app/data:ro
    networks:
      - wren
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.15.0
    pull_policy: always
    ports:
      - 6333:6333
      - 6334:6334
    networks:
      - wren

  # If you want to use postgres for testing purpose, uncomment the following block
  # postgres:
  #   image: postgres:14-alpine
  #   platform: ${PLATFORM}
  #   ports:
  #     - 9432:5432
  #   volumes:
  #     - data:/var/lib/postgresql/data
  #   environment:
  #     - POSTGRES_PASSWORD=secret
  #     - POSTGRES_USER=test
  #     - POSTGRES_DB=test
  #     - PGDATA=/var/lib/postgresql/data/pgdata
  #   networks:
  #     - wren
