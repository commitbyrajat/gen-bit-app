version: "3.8"

volumes:
  data:
  metadata_data:

networks:
  wren:
    driver: bridge

services:
  wren-engine:
    image: wren-toolkit-http:${WREN_ENGINE_VERSION:-latest}
    build:
      context: ../../../../toolkit/core/wren
    platform: ${PLATFORM}
    ports:
      - ${WREN_ENGINE_PORT:-8000}:8000
    environment:
      WREN_TOOLKIT_METADATA_DATABASE_URL: postgresql://wren:wren123@wren-ui-metadata-postgres:5432/wren_ui_metadata
    networks:
      - wren
    depends_on:
      wren-ui-metadata-postgres:
        condition: service_healthy

  wren-ui-metadata-postgres:
    image: postgres:16
    pull_policy: always
    platform: ${PLATFORM}
    environment:
      POSTGRES_DB: wren_ui_metadata
      POSTGRES_USER: wren
      POSTGRES_PASSWORD: wren123
    volumes:
      - metadata_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wren -d wren_ui_metadata"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wren

  qdrant:
    image: qdrant/qdrant:v1.15.0
    pull_policy: always
    ports:
      - 6333:6333
      - 6334:6334
    networks:
      - wren

  wren-ui:
    image: ghcr.io/canner/wren-ui:${WREN_UI_VERSION}
    pull_policy: always
    platform: ${PLATFORM}
    environment:
      DB_TYPE: sqlite
      # /app is the working directory in the container
      SQLITE_FILE: /app/data/db.sqlite3
      WREN_ENGINE_ENDPOINT: http://wren-engine:8000
      WREN_AI_ENDPOINT: http://host.docker.internal:${WREN_AI_SERVICE_PORT}
      WREN_TOOLKIT_ENDPOINT: http://wren-engine:8000
      GENERATION_MODEL: ${GENERATION_MODEL}
      # telemetry
      WREN_ENGINE_PORT: 8000
      WREN_AI_SERVICE_VERSION: ${WREN_AI_SERVICE_VERSION}
      WREN_UI_VERSION: ${WREN_UI_VERSION}
      WREN_ENGINE_VERSION: ${WREN_ENGINE_VERSION}
      USER_UUID: ${USER_UUID}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY}
      POSTHOG_HOST: ${POSTHOG_HOST}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED}
      # client side
      NEXT_PUBLIC_USER_UUID: ${USER_UUID}
      NEXT_PUBLIC_POSTHOG_API_KEY: ${POSTHOG_API_KEY}
      NEXT_PUBLIC_POSTHOG_HOST: ${POSTHOG_HOST}
      NEXT_PUBLIC_TELEMETRY_ENABLED: ${TELEMETRY_ENABLED}
      # configs
      WREN_PRODUCT_VERSION: ${WREN_PRODUCT_VERSION}

    ports:
      - ${WREN_UI_PORT}:3000
    volumes:
      - ./etc:/app/data
    networks:
      - wren
    depends_on:
      - wren-engine

  postgres:
    image: postgres:14-alpine
    platform: ${PLATFORM}
    ports:
      - 5432:5432
    volumes:
      - data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=test
      - PGDATA=/var/lib/postgresql/data/pgdata
    networks:
      - wren
