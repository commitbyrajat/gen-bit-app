services:
  wren-engine:
    image: wren-toolkit-http:latest
    build:
      context: ../../../toolkit/core/wren
    ports:
      - "8000:8000"
    environment:
      WREN_TOOLKIT_METADATA_DATABASE_URL: postgresql://wren:wren123@metadata-postgres:5432/wren_ui_metadata
    depends_on:
      metadata-postgres:
        condition: service_healthy

  metadata-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: wren_ui_metadata
      POSTGRES_USER: wren
      POSTGRES_PASSWORD: wren123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wren -d wren_ui_metadata"]
      interval: 5s
      timeout: 5s
      retries: 10
