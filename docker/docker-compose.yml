x-lancedb-minio-env: &lancedb-minio-env
  WREN_MEMORY_PATH: s3://wren-lancedb/memory
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  AWS_ENDPOINT: http://minio:9000
  AWS_ENDPOINT_URL: http://minio:9000
  ALLOW_HTTP: "true"

services:
  postgres:
    image: postgres:16
    container_name: wren-wealth-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: wealth_demo
      POSTGRES_USER: wren
      POSTGRES_PASSWORD: wren123
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d
      - wealth_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wren -d wealth_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  wren-ui-metadata-postgres:
    image: postgres:16
    container_name: wren-ui-metadata-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: wren_ui_metadata
      POSTGRES_USER: wren
      POSTGRES_PASSWORD: wren123
    volumes:
      - wren_ui_metadata_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wren -d wren_ui_metadata"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: wren-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    container_name: wren-litellm
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-replace-with-openai-api-key}
      CLIENT_LLM_GEMINI_FLASH_API_KEY: ${CLIENT_LLM_GEMINI_FLASH_API_KEY:-sk-client-gemini-flash}
      CLIENT_LLM_GEMINI_FLASH_TEST_API_KEY: ${CLIENT_LLM_GEMINI_FLASH_TEST_API_KEY:-sk-client-gemini-flash-test}
      CLIENT_EMBED_BGE_M3_API_KEY: ${CLIENT_EMBED_BGE_M3_API_KEY:-sk-client-bge-m3}
      CLIENT_EMBED_BGE_M3_TEST_API_KEY: ${CLIENT_EMBED_BGE_M3_TEST_API_KEY:-sk-client-bge-m3-test}
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./litellm/custom_auth.py:/app/custom_auth.py:ro

  minio:
    image: minio/minio:latest
    container_name: wren-lancedb-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - lancedb_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  lancedb-bucket:
    image: minio/mc:latest
    container_name: wren-lancedb-bucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        sleep 2;
      done;
      mc mb --ignore-existing local/wren-lancedb;
      mc mb --ignore-existing local/wren-iceberg;
      "
    environment:
      <<: *lancedb-minio-env

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    container_name: wren-iceberg-rest
    ports:
      - "8181:8181"
    depends_on:
      lancedb-bucket:
        condition: service_completed_successfully
    environment:
      JAVA_TOOL_OPTIONS: -Dorg.slf4j.simpleLogger.log.org.apache.iceberg.rest.RESTCatalogServlet=off
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      CATALOG_WAREHOUSE: s3://wren-iceberg/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_S3_ACCESS__KEY__ID: minioadmin
      CATALOG_S3_SECRET__ACCESS__KEY: minioadmin
    volumes:
      - iceberg_catalog_data:/tmp

  trino:
    image: trinodb/trino:481
    container_name: wren-trino
    ports:
      - "8080:8080"
    depends_on:
      iceberg-rest:
        condition: service_healthy
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro

  loans-data:
    image: trinodb/trino:481
    container_name: wren-loans-data
    depends_on:
      trino:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - /bin/sh /seed/seed-loans.sh
    volumes:
      - ./trino/init:/seed:ro
    restart: "no"

volumes:
  wealth_pg_data:
  wren_ui_metadata_pg_data:
  qdrant_data:
  lancedb_minio_data:
  iceberg_catalog_data:
